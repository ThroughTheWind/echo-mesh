name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash runs every step with -e and -o pipefail.
    shell: bash

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The backlog gates compare item status with what git says merged.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .ai/rungs.mjs check full

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Format
        run: ./gradlew spotlessCheck
      # The gate logic is tested in both directions before any gate is trusted.
      - name: Gate self-tests
        run: ./gradlew -p build-logic test
      - name: Transport, crypto and compression boundaries (ADR-0002, ADR-0005, crypto rule)
        run: ./gradlew checkTransportBoundaries checkCryptoBoundaries checkCompressionImports
      - name: No forbidden dependency, no INTERNET permission (ADR-0003)
        run: ./gradlew checkForbiddenDependencies checkManifestPermissions
      - name: Unit tests
        run: ./gradlew test
      # The wire decoder reads hostile bytes, so it is fuzzed on every change (ADR-0005, spec AC-12).
      # A finding fails the build and is saved under core/mesh/src/test/resources: commit it with the
      # fix, and every later test run replays it. --rerun because Gradle does not see the variable.
      - name: Fuzz the wire decoder
        run: JAZZER_FUZZ=1 ./gradlew :core:mesh:test --rerun --tests '*.WireFuzzTest'
      # Jazzer fuzzes one target per run, so the group decoders (inner messages, join payloads, the
      # QR text) get their own step.
      - name: Fuzz the group decoders
        run: JAZZER_FUZZ=1 ./gradlew :core:mesh:test --rerun --tests '*.GroupFuzzTest'
      - name: Upload fuzzing findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: core/mesh/src/test/resources/**/crash-*
          if-no-files-found: ignore
      # Prove the fuzzing step can fail: the same harness around a decoder with a planted bug.
      - name: Fuzzing finds a planted bug
        run: |
          if ECHO_FUZZ_SELF_TEST=1 JAZZER_FUZZ=1 ./gradlew :core:mesh:test --rerun --tests '*.WireFuzzSelfTest' > fuzz-self-test.log 2>&1; then
            echo "::error::The fuzzing step is blind: Jazzer did not find the planted decoder bug"
            cat fuzz-self-test.log
            exit 1
          fi
          if ! grep -q "FuzzTestFindingException" fuzz-self-test.log; then
            echo "::error::The planted-bug run failed, but not with a fuzzing finding"
            cat fuzz-self-test.log
            exit 1
          fi
      - name: Android lint
        run: ./gradlew lint
      - name: Debug APK
        run: ./gradlew :app:assembleDebug
      # Unsigned here: only the release workflow holds the key. Building it on every change means R8
      # and release lint break a pull request, not a release tag.
      - name: Release APK (unsigned)
        run: ./gradlew :app:assembleRelease
      # Check the artifact, not the build script: the APKs themselves ask for no INTERNET permission.
      - name: No INTERNET permission in the built APKs
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2"
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} < 2 )); then
            echo "::error::Expected a debug and a release APK, found: ${apks[*]:-none}"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            permissions="$("$aapt2" dump permissions "$apk")"
            if ! grep -q '^package:' <<< "$permissions"; then
              echo "::error::The check is blind: aapt2 printed no package line for $apk"
              echo "$permissions"
              exit 1
            fi
            if grep -q "android.permission.INTERNET" <<< "$permissions"; then
              echo "::error::$apk asks for android.permission.INTERNET (ADR-0003)"
              exit 1
            fi
          done
      # The simulated radio is for development only. Prove the release build does not link it, and
      # that the check can fail by finding it in the debug build.
      - name: No simulated radio in release builds
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > debug-deps.txt
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > release-deps.txt
          if ! grep -q "adapters:loopback" debug-deps.txt; then
            echo "::error::The check is blind: :adapters:loopback not found in the debug build either"
            head -n 80 debug-deps.txt || true
            exit 1
          fi
          if grep -q "adapters:loopback" release-deps.txt; then
            echo "::error::The release build links :adapters:loopback (the simulated radio)"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Every push to main refreshes the "dev" pre-release with a debug APK, so testers can install it
  # from the Releases page.
  dev-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gates, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: debug-apk
          path: apk
      - name: Publish the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv apk/*.apk dev-debug.apk
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev dev-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development build" \
            --notes "Debug build of main at ${GITHUB_SHA::7}. Pre-alpha, not reviewed for security: do not rely on it at a protest."
