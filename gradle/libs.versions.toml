[versions]
# The app version. The version code is derived from it in app/build.gradle.kts, and a release
# tag must be "v" + this value (checked by .github/workflows/release.yml).
app = "0.1.0"

# SDK levels. minSdk 31 (Android 12) so Bluetooth never needs location permission (Antoine,
# 2026-11-16, ADR-0001). compileSdk 37 is required by Compose 1.12+.
minSdk = "31"
compileSdk = "37"
targetSdk = "36"
jvmTarget = "17"

agp = "9.5.0"
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.13.0"
composeBom = "2026.09.00"
activity = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
datastore = "1.3.0"
junit = "6.1.3"
# Decoder fuzzing (ADR-0005). Test classpath only; Apache-2.0.
jazzer = "0.30.0"
# Every cryptographic primitive (ADR-0004). tink-android on the JVM too: the plain "tink" artifact
# pulls in an HTTP client and native Conscrypt, and gradle/forbidden-dependencies.txt refuses it.
tink = "1.24.0"
# Offline map renderer (ADR-0006): LGPL-3.0, no network module (vtm-http is forbidden).
vtm = "0.25.0"
spotless = "8.11.0"
ktlint = "1.8.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
vtm-android = { module = "org.mapsforge:vtm-android", version.ref = "vtm" }
vtm-themes = { module = "org.mapsforge:vtm-themes", version.ref = "vtm" }
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }

# Compile-only dependencies of the convention plugins in build-logic/.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Convention plugins from build-logic/ (ADR-0001). Versionless: they come from the included build.
conventions-jvm-library = { id = "conventions.jvm.library" }
conventions-android-library = { id = "conventions.android.library" }
conventions-android-application = { id = "conventions.android.application" }
conventions-gates = { id = "conventions.gates" }
